[package]
name = "lele_download"
version = "26.11.10"
description = "LeLe Download Manager"
authors = ["DownloadMaster"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2.2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
dirs = "5.0"
url = "2.5"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# BitTorrent / 磁力下载（纯 Rust 嵌入式 BT 客户端）
librqbit = "9"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
schemars = { path = "../vpatch/schemars-0.8.22" }
# 落盘洗路径补丁：vendor 两个 crate 并在本地打补丁，使文件名含路径分隔符/遍历段的
# 畸形种子也能解析并下载（仅存储层改名，info_hash 由 raw_bytes 派生、不受影响）。
librqbit = { path = "../vpatch/librqbit-9.0.0" }
librqbit-core = { path = "../vpatch/librqbit-core-9.0.0" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
